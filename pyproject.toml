[project]
name = "retail-platform"
version = "0.1.0"
description = "Real-time retail data engineering platform: Kafka, Spark Structured Streaming, Snowflake"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Aiman Che Razani" }]
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.10,<3",
    "confluent-kafka[schemaregistry,json]>=2.15,<3",
    "structlog>=26.1",
    "prometheus-client>=0.22",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
spark = ["pyspark==4.2.0"]
snowflake = ["snowflake-connector-python>=4.7,<5", "cryptography>=45"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "mypy>=1.18",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
    "pip-audit>=2.9",
]

[project.scripts]
retail-topics = "retail_platform.cli.topics:main"
retail-schemas = "retail_platform.cli.schemas:main"
retail-simulator = "retail_platform.cli.simulator:main"
retail-dlq = "retail_platform.cli.dlq:main"
retail-spark-ingest = "retail_platform.cli.spark:ingest_main"
retail-spark-realtime = "retail_platform.cli.spark:realtime_main"
retail-loader = "retail_platform.cli.loader:main"
retail-snowflake-migrate = "retail_platform.cli.snowflake_migrate:main"
retail-reconcile = "retail_platform.cli.reconcile:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_platform"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "C4", "SIM", "RET", "PTH", "PL", "RUF", "T20", "TRY", "DTZ",
]
ignore = [
    "PLR0913",  # many-argument constructors are fine for explicit dependency injection
    "PLR2004",  # magic values in comparisons are clearer inline for domain constants
    "TRY003",   # messages on exceptions are useful context
    "S311",     # random is used for simulation, not cryptography
    "S608",     # SQL is built from validated identifiers only (see sql helpers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "S105", "S106", "PLC0415"]
# Entry points import heavy client libraries lazily, after logging is configured.
"src/retail_platform/cli/*" = ["PLC0415"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["retail_platform"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "snowflake.*", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# confluent-kafka re-exports its admin classes without __all__
module = ["confluent_kafka.*"]
implicit_reexport = true

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests without external dependencies",
    "contract: schemas/examples/topic declarations vs code",
    "spark: needs a JVM and pyspark (run in the Spark container or with JDK 17/21)",
    "integration: needs docker compose services (Kafka, Schema Registry, PostgreSQL)",
    "e2e: full pipeline tests",
    "snowflake: needs a live Snowflake account",
]
filterwarnings = [
    "error::DeprecationWarning:retail_platform.*",
    "ignore::DeprecationWarning:authlib.*",
]

[tool.coverage.run]
source = ["retail_platform"]
branch = true
