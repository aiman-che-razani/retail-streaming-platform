# Spark defaults for the local-mode containers (overridable per job in SparkSettings).
spark.sql.session.timeZone                          UTC
spark.sql.shuffle.partitions                        6
spark.sql.adaptive.enabled                          true
# RocksDB keeps streaming state off the JVM heap and checkpoints incrementally.
spark.sql.streaming.stateStore.providerClass        org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled  true
spark.sql.streaming.metricsEnabled                  true
spark.ui.showConsoleProgress                        false
# log4j2.properties in this directory is picked up because SPARK_CONF_DIR points here.
