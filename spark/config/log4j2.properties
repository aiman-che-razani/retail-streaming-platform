# Spark JVM logging: WARN to stdout to keep container logs readable; our Python driver
# logs structured JSON separately (ADR-009).
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'}{UTC}","level":"%p","logger":"%c","service":"spark-jvm","event":"%enc{%m}{JSON}"}%n

# Noisy but harmless in local mode
logger.kafka.name = org.apache.kafka
logger.kafka.level = warn
logger.netty.name = org.sparkproject.jetty
logger.netty.level = error
logger.microbatch.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.microbatch.level = warn
