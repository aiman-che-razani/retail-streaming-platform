version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/docker/app"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/docker/spark"
    schedule:
      interval: monthly
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
